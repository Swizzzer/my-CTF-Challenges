<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRAVELLING — HITszCTF 2026</title>
  <style>
    :root {
      --paper: #efe7d7;
      --ink: #111111;
      --red: #d7261e;
      --blue: #1a3a8f;
      --mute: #7a7366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
      background-image:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.025) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.02) 0 1px, transparent 1px 3px);
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .stage {
      width: min(1000px, 100%);
      aspect-ratio: 4 / 3;
      max-height: calc(100vh - 48px);
      position: relative;
      border: 3px solid var(--ink);
      background: var(--paper);
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(12, 1fr);
    }

    .tri-red {
      position: absolute;
      right: 0;
      top: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 420px 420px 0;
      border-color: transparent var(--red) transparent transparent;
      z-index: 0;
      opacity: 0.95;
    }


    .ring-blue {
      position: absolute;
      left: 6%;
      bottom: 8%;
      width: 180px;
      height: 180px;
      border: 18px solid var(--blue);
      border-radius: 50%;
      z-index: 0;
    }

    .sq-red {
      position: absolute;
      right: 6%;
      bottom: 10%;
      width: 72px;
      height: 72px;
      background: var(--red);
      z-index: 0;
    }

    .dot-black {
      position: absolute;
      right: 14%;
      bottom: 6%;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--ink);
      z-index: 0;
    }

    .line-top {
      position: absolute;
      left: 0;
      right: 0;
      top: 11%;
      height: 3px;
      background: var(--ink);
      z-index: 0;
    }

    .line-bot {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14%;
      height: 2px;
      background: var(--ink);
      z-index: 0;
    }


    .masthead {
      grid-column: 1 / 8;
      grid-row: 1 / 2;
      align-self: start;
      padding: 14px 22px;
      font-size: clamp(10px, 1.4vw, 13px);
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      display: flex;
      gap: 18px;
      align-items: center;
      z-index: 2;
    }

    .masthead .dot-sep {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--red);
      display: inline-block;
    }

    .serial {
      grid-column: 9 / 13;
      grid-row: 1 / 2;
      align-self: start;
      padding: 14px 22px;
      font-size: clamp(10px, 1.4vw, 13px);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: right;
      color: var(--paper);
      z-index: 2;
      /* 文字需要压在红三角之上 */
    }

    .kicker {
      grid-column: 2 / 8;
      grid-row: 3 / 4;
      align-self: center;
      z-index: 2;
    }

    .kicker span {
      display: inline-block;
      background: var(--ink);
      color: var(--paper);
      padding: 8px 16px;
      font-size: clamp(12px, 1.6vw, 16px);
      font-weight: 900;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .h1-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .headline {
      grid-column: 2 / 12;
      grid-row: 4 / 9;
      align-self: center;
      z-index: 2;
      padding-right: 8px;
    }

    h1 {
      font-size: clamp(72px, 15vw, 180px);
      line-height: 0.86;
      letter-spacing: -0.03em;
      font-weight: 900;
      color: var(--ink);
      text-transform: uppercase;
    }

    h1 .accent {
      color: var(--red);
    }

    h1 .stroke {
      -webkit-text-stroke: 3px var(--ink);
      color: transparent;
    }

    .message {
      grid-column: 5 / 12;
      grid-row: 10 / 12;
      align-self: center;
      z-index: 2;
      padding: 16px 20px;
      background: var(--paper);
      border-top: 4px solid var(--ink);
      border-left: 8px solid var(--red);
      font-size: clamp(14px, 1.8vw, 20px);
      font-weight: 700;
      line-height: 1.3;
      max-width: 560px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stamp {
      grid-column: 1 / 4;
      grid-row: 11 / 13;
      align-self: end;
      justify-self: start;
      margin: 0 0 14px 22px;
      z-index: 2;
      font-size: clamp(10px, 1.2vw, 12px);
      font-weight: 900;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .stamp::before {
      content: "";
      display: inline-block;
      width: 22px;
      height: 3px;
      background: var(--red);
      vertical-align: middle;
      margin-right: 8px;
    }

    @media (max-width: 720px) {
      .stage {
        aspect-ratio: auto;
        min-height: calc(100vh - 48px);
      }

      .tri-red {
        border-width: 0 240px 240px 0;
      }

      .ring-blue {
        width: 110px;
        height: 110px;
        border-width: 12px;
      }

    }
  </style>
</head>

<body>
  <div class="stage" role="main">
    <div class="tri-red" aria-hidden="true"></div>
    <div class="ring-blue" aria-hidden="true"></div>
    <div class="sq-red" aria-hidden="true"></div>
    <div class="dot-black" aria-hidden="true"></div>
    <div class="line-top" aria-hidden="true"></div>
    <div class="line-bot" aria-hidden="true"></div>

    <header class="masthead">
      <span>HITszCTF</span>
      <span class="dot-sep" aria-hidden="true"></span>
      <span>2026</span>
    </header>
    <div class="serial">Presented by Del0n1x</div>

    <div class="kicker"><span>Where are we going?</span></div>

    <div class="headline">
      <svg class="h1-svg" viewBox="0 0 1000 180" preserveAspectRatio="xMinYMid meet" aria-label="TRAVELLING">
        <text x="0" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="200"
          letter-spacing="-6" textLength="1000" lengthAdjust="spacingAndGlyphs">
          <tspan fill="#d7261e">TRA</tspan>
          <tspan fill="none" stroke="#111" stroke-width="3">VEL</tspan>
          <tspan fill="#111">LING</tspan>
        </text>
      </svg>
    </div>

    <div class="message">
      A quiet route begins from a sharp travelling signal.
    </div>

    <div class="stamp">HitszCTF 2026</div>
  </div>
</body>

</html>
