name: isoDream
author: Swizzer
category: Crypto
difficulty: Hard
description: |-
  又是一个漫长的夏夜，你合上书本观察起房间里的吊灯，萦回的光影仿佛在告诉你它的补空间的基本群是<a,b|a^2=b^3>。
  “是时候去睡觉了”，你想着，期待着在梦里能遇见更加广阔的域，好让你用除法狠狠地切割那些多项式，把它们分解成再不分离的素元。
  你闭上眼，耳边似乎听见某种曲线的纽结。你顺着一条椭圆的同源路径走去，远方的地平线闪烁着超奇异的光芒，群和域的边界正缓缓向你靠近。

